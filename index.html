<!DOCTYPE html>
<html lang="id"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Keuangan">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Keuangan Keluarga</title>
<style>
:root{--a:#4f6bff;--g:linear-gradient(135deg,#4f6bff,#8b5cf6);--tx:#12162b;--mu:#7a819c;--ln:#e9ecf7;--in:#10b981;--out:#f43f5e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
body{margin:0;font:16px/1.4 -apple-system,"SF Pro Display",system-ui,sans-serif;color:var(--tx);background:#fff radial-gradient(circle at 95% -5%,#dfe6ff,transparent 40%) fixed;min-height:100vh}
#app{max-width:560px;margin:auto;padding:calc(env(safe-area-inset-top) + 16px) 16px calc(120px + env(safe-area-inset-bottom))}
h2{font-size:22px;margin:6px 0 12px;letter-spacing:-.3px}
small,.mu{color:var(--mu)}.in{color:var(--in)}.out{color:var(--out)}
.glass{background:rgba(255,255,255,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.9);box-shadow:0 8px 28px rgba(79,107,255,.10);border-radius:20px;padding:16px;margin-bottom:12px}
.glass b{display:block;font-size:19px;margin-top:2px}
.hero{background:var(--g);color:#fff;border:0;box-shadow:0 14px 34px rgba(99,102,241,.35)}.hero small{color:#e6e9ff}.hero b{font-size:32px;letter-spacing:-.6px}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}.between{display:flex;justify-content:space-between;gap:8px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--ln);background:#fff;border-radius:999px;padding:10px 15px;font:inherit;color:var(--tx);min-height:44px}
.chip.on{background:var(--g);color:#fff;border-color:transparent}
input,select{width:100%;font:inherit;padding:13px;border:1px solid var(--ln);border-radius:14px;background:#fff;color:var(--tx);min-height:48px}
label{display:block;margin:14px 0 6px;font-size:14px;color:var(--mu)}
.btn{width:100%;border:0;border-radius:16px;padding:16px;font:inherit;font-weight:600;color:#fff;background:var(--g);margin-top:16px;min-height:54px}
.btn:disabled{opacity:.6}.btn.del{background:#fff;color:var(--out);border:1px solid var(--out);margin-top:10px}
.bar{height:8px;background:#eef0fa;border-radius:9px;overflow:hidden;margin-top:5px}.bar i{display:block;height:100%;background:var(--g);border-radius:9px;transition:width .6s}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px;cursor:pointer}.item b{margin:0;white-space:nowrap}
.logo{width:76px;height:76px;border-radius:24px;background:var(--g);color:#fff;font-size:28px;font-weight:700;display:grid;place-items:center;margin:0 auto 14px;box-shadow:0 12px 30px rgba(99,102,241,.4)}
nav{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:auto;display:flex;justify-content:space-around;align-items:center;padding:8px 6px calc(8px + env(safe-area-inset-bottom));background:rgba(255,255,255,.86);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--ln)}
nav button{background:none;border:0;color:var(--mu);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:62px;min-height:50px}
nav button.on{color:var(--a)}nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav .fab{width:62px;height:62px;border-radius:50%;background:var(--g);color:#fff;margin-top:-30px;font-size:34px;justify-content:center;box-shadow:0 10px 24px rgba(99,102,241,.45)}
.ov{position:fixed;inset:0;background:rgba(18,22,43,.35);backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center;z-index:9;animation:f .2s}
.sheet{background:#fff;width:100%;max-width:560px;max-height:94%;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;border-radius:26px 26px 0 0;padding:0 16px;animation:u .28s cubic-bezier(.2,.8,.2,1)}
.ov{overscroll-behavior:contain}.noanim{animation:none!important}
.hd{position:sticky;top:0;z-index:2;background:#fff;display:flex;justify-content:space-between;align-items:center;padding:14px 0 10px}.hd h2{margin:0;font-size:20px}
.x{width:44px;height:44px;border-radius:50%;border:0;background:#f0f2fa;font-size:18px;color:var(--tx)}
.ft{position:sticky;bottom:0;z-index:2;background:#fff;border-top:1px solid var(--ln);margin-top:14px;padding:12px 0 calc(12px + env(safe-area-inset-bottom))}.ft .btn{margin-top:0}.ft .btn+.btn{margin-top:10px}
@keyframes u{from{transform:translateY(50px);opacity:0}}@keyframes f{from{opacity:0}}
.sk{height:96px;border-radius:20px;background:linear-gradient(90deg,#f0f2fa 25%,#e4e8f6 50%,#f0f2fa 75%);background-size:200% 100%;animation:s 1.2s infinite;margin-bottom:12px}@keyframes s{to{background-position:-200% 0}}
.toast{position:fixed;top:calc(env(safe-area-inset-top) + 10px);left:50%;transform:translateX(-50%);padding:12px 18px;border-radius:14px;color:#fff;z-index:99;font-weight:600;max-width:90%;text-align:center;animation:f .2s}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head>
<body>
<div id="app"><div id="v"></div></div>
<nav id="nv" hidden></nav>
<div id="ov"></div>
<script>
/* ===== KONFIGURASI ===== */
const API_URL = 'https://script.google.com/macros/s/AKfycbwu7-tCu-wJbOmb4GdykiUQMnYSlKwfph-izp42URoFm6EzbvfkH-nB4mKE7ueuC2ORxA/exec';
const NAMA = ['Suami', 'Istri']; // harus sama dengan nama di Code.gs

const $ = s => document.querySelector(s);
const rp = n => 'Rp ' + Math.round(n).toLocaleString('id-ID');
const dots = s => String(s).replace(/\D/g, '').replace(/\B(?=(\d{3})+(?!\d))/g, '.');
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const iso = d => new Date(d - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
const D = s => new Date(s + 'T00:00:00');
const empty = m => `<div class="mu" style="text-align:center;padding:36px 10px">${m}</div>`;
let S = { user: localStorage.u, pin: localStorage.p, data: null, tab: 'home', per: 'bulan', from: '', to: '' }, F = {}, LU = NAMA[0];

async function api(act, extra = {}) {
  let j;
  try {
    const r = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ act, user: S.user, pin: S.pin, ...extra }) });
    j = await r.json();
  } catch (e) { throw new Error('Tidak bisa terhubung. Periksa internet lalu coba lagi.'); }
  if (!j.ok) throw new Error(j.error);
  return j.data;
}
function toast(m, ok = 1, ms = 2600) {
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = m; t.style.background = ok ? '#10b981' : '#f43f5e';
  document.body.appendChild(t); setTimeout(() => t.remove(), ms);
}

/* ===== LOGIN & NAVIGASI ===== */
function loginView() {
  $('#nv').hidden = true;
  $('#v').innerHTML = `<div style="padding-top:12vh;text-align:center"><div class="logo">Rp</div><h2>Keuangan Keluarga</h2><p class="mu">Pilih nama, lalu masukkan PIN</p>
  <div class="chips" style="justify-content:center">${NAMA.map(n => `<button class="chip ${n == LU ? 'on' : ''}" onclick="LU='${n}';loginView()">${n}</button>`).join('')}</div>
  <input id="pin" type="password" inputmode="numeric" placeholder="PIN" style="margin:16px 0 0;text-align:center"><button class="btn" onclick="doLogin()">Masuk</button></div>`;
}
async function doLogin() {
  S.user = LU; S.pin = $('#pin').value;
  try { await api('login'); localStorage.u = S.user; localStorage.p = S.pin; boot(); } catch (e) { toast(e.message, 0); }
}
function logout() { localStorage.removeItem('u'); localStorage.removeItem('p'); S.user = S.pin = S.data = null; loginView(); }
const I = {
  home: '<path d="M3 11l9-8 9 8v9a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z"/>',
  list: '<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
  log: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  cog: '<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>'
};
function shell() {
  const b = (t, l, i) => `<button class="${S.tab == t ? 'on' : ''}" onclick="go('${t}')"><svg viewBox="0 0 24 24">${I[i]}</svg>${l}</button>`;
  $('#nv').hidden = false;
  $('#nv').innerHTML = b('home', 'Beranda', 'home') + b('hist', 'Riwayat', 'list') + `<button class="fab" onclick="openForm()" aria-label="Tambah transaksi">+</button>` + b('log', 'Log', 'log') + b('set', 'Setelan', 'cog');
}
function go(t) { S.tab = t; shell(); render(); scrollTo(0, 0); }
async function boot() { if (S.user && S.pin) { shell(); load(); } else loginView(); }
async function load(silent) {
  if (!silent) $('#v').innerHTML = '<div class="sk"></div><div class="sk"></div><div class="sk"></div>';
  try { S.data = await api('load'); render(); }
  catch (e) {
    if (/PIN/.test(e.message)) { toast(e.message, 0); return logout(); }
    $('#v').innerHTML = empty(esc(e.message) + '<br><br><button class="chip" onclick="load()">Coba lagi</button>');
  }
}
function render() {
  if (!S.data) return;
  const v = $('#v');
  if (S.tab == 'home') v.innerHTML = home();
  else if (S.tab == 'hist') { v.innerHTML = hist(); hl(); }
  else if (S.tab == 'log') v.innerHTML = logv();
  else v.innerHTML = setv();
}

/* ===== DATA & PERIODE ===== */
const all = () => [...S.data.masuk.map(x => ({ ...x, t: 'masuk' })), ...S.data.keluar.map(x => ({ ...x, t: 'keluar' }))];
const inR = (x, f, e) => x.tgl >= f && x.tgl <= e;
const tot = (a, t, f, e) => a.filter(x => x.t == t && inR(x, f, e)).reduce((s, x) => s + x.nom, 0);
function rng() {
  const n = new Date(), t = iso(n); let f = t, e = t;
  if (S.per == 'minggu') f = iso(new Date(+n - ((n.getDay() + 6) % 7) * 864e5));
  else if (S.per == 'bulan') f = t.slice(0, 8) + '01';
  else if (S.per == 'custom' && S.from && S.to) { f = S.from; e = S.to; }
  return [f, e];
}
function per(k) { S.per = k; render(); }

/* ===== BERANDA ===== */
function trend(a, f, e, days) {
  const g = days > 62 ? 7 : 10, B = {};
  if (days <= 62) for (let i = 0; i < days; i++) B[iso(new Date(+D(f) + i * 864e5))] = [0, 0];
  a.filter(x => inR(x, f, e)).forEach(x => { const k = x.tgl.slice(0, g); (B[k] = B[k] || [0, 0])[x.t == 'masuk' ? 0 : 1] += x.nom; });
  const K = Object.keys(B).sort(), mx = Math.max(1, ...K.map(k => Math.max(...B[k]))), w = 300 / K.length;
  return `<svg viewBox="0 0 300 112" width="100%">` + K.map((k, i) => {
    const h1 = B[k][0] / mx * 95, h2 = B[k][1] / mx * 95;
    return `<rect x="${i * w + w * .08}" y="${100 - h1}" width="${w * .4}" height="${h1}" rx="2" fill="#10b981"/><rect x="${i * w + w * .5}" y="${100 - h2}" width="${w * .4}" height="${h2}" rx="2" fill="#f43f5e"/>`;
  }).join('') + `<text x="0" y="111" font-size="9" fill="#7a819c">${K[0].slice(5)}</text><text x="300" y="111" font-size="9" fill="#7a819c" text-anchor="end">${K[K.length - 1].slice(5)}</text></svg>`;
}
function home() {
  const [f, e] = rng(), a = all(), m = tot(a, 'masuk', f, e), k = tot(a, 'keluar', f, e);
  const days = Math.round((D(e) - D(f)) / 864e5) + 1, pf = iso(new Date(+D(f) - days * 864e5)), pe = iso(new Date(+D(f) - 864e5)), pk = tot(a, 'keluar', pf, pe);
  const saldo = S.data.saldoAwal + tot(a, 'masuk', '0', '9') - tot(a, 'keluar', '0', '9');
  const ks = {}; a.filter(x => x.t == 'keluar' && inR(x, f, e)).forEach(x => ks[x.kat] = (ks[x.kat] || 0) + x.nom);
  const kl = Object.entries(ks).sort((p, q) => q[1] - p[1]), mx = kl[0] ? kl[0][1] : 1, mx2 = Math.max(m, k, 1);
  const P = [['hari', 'Hari ini'], ['minggu', 'Minggu ini'], ['bulan', 'Bulan ini'], ['custom', 'Custom']];
  const none = !a.some(x => inR(x, f, e));
  return `<div class="chips">${P.map(([x, l]) => `<button class="chip ${S.per == x ? 'on' : ''}" onclick="per('${x}')">${l}</button>`).join('')}</div>
  ${S.per == 'custom' ? `<div class="row" style="margin-top:10px"><input type="date" value="${S.from}" onchange="S.from=this.value;render()"><input type="date" value="${S.to}" onchange="S.to=this.value;render()"></div>` : ''}
  <div class="glass hero" style="margin-top:12px"><small>Saldo saat ini</small><b>${rp(saldo)}</b></div>
  <div class="row"><div class="glass"><small>Pemasukan</small><b class="in">${rp(m)}</b></div><div class="glass"><small>Pengeluaran</small><b class="out">${rp(k)}</b></div></div>
  <div class="glass"><small>Saldo bersih periode</small><b class="${m - k < 0 ? 'out' : ''}">${rp(m - k)}</b></div>
  ${none ? `<div class="glass">${empty('Belum ada transaksi di periode ini.<br>Tekan tombol + untuk mencatat yang pertama.')}</div>` : `
  <div class="glass"><b style="margin:0 0 8px">Insight</b>
  ${kl[0] ? `<p>Pengeluaran terbesar: <b style="display:inline;font-size:16px">${esc(kl[0][0])}</b> ${rp(kl[0][1])} (${Math.round(kl[0][1] / k * 100)}%)</p>` : ''}
  <p>Rata-rata pengeluaran harian: <b style="display:inline;font-size:16px">${rp(k / days)}</b></p>
  <p style="margin-bottom:0">${pk ? `Pengeluaran ${k > pk ? 'naik' : 'turun'} <b style="display:inline;font-size:16px" class="${k > pk ? 'out' : 'in'}">${Math.abs(Math.round((k - pk) / pk * 100))}%</b> dari periode sebelumnya (${rp(pk)})` : 'Belum ada data periode sebelumnya.'}</p></div>
  <div class="glass"><b style="margin:0 0 4px">Pengeluaran per kategori</b>${kl.slice(0, 6).map(([n, v]) => `<div style="margin-top:10px"><div class="between"><span>${esc(n)}</span><span>${rp(v)}</span></div><div class="bar"><i style="width:${v / mx * 100}%"></i></div></div>`).join('') || empty('Belum ada pengeluaran')}</div>
  <div class="glass"><b style="margin:0 0 6px">Tren ${days > 62 ? 'bulanan' : 'harian'}</b>${trend(a, f, e, days)}<small><span class="in">■</span> Pemasukan &nbsp;<span class="out">■</span> Pengeluaran</small></div>
  <div class="glass"><b style="margin:0 0 4px">Pemasukan vs pengeluaran</b>
  <div class="between" style="margin-top:8px"><span>Pemasukan</span><span>${rp(m)}</span></div><div class="bar"><i style="width:${m / mx2 * 100}%;background:#10b981"></i></div>
  <div class="between" style="margin-top:10px"><span>Pengeluaran</span><span>${rp(k)}</span></div><div class="bar"><i style="width:${k / mx2 * 100}%;background:#f43f5e"></i></div></div>`}`;
}

/* ===== RIWAYAT, LOG, SETELAN ===== */
function hist() {
  const K = [...new Set([...S.data.kat.Pengeluaran, ...S.data.kat.Pemasukan])];
  return `<h2>Riwayat</h2><input placeholder="Cari catatan, kategori, nama…" value="${esc(S.q || '')}" oninput="S.q=this.value;hl()">
  <select style="margin:8px 0" onchange="S.kf=this.value;hl()"><option value="">Semua kategori</option>${K.map(k => `<option ${S.kf == k ? 'selected' : ''}>${esc(k)}</option>`).join('')}</select>
  <div class="row" style="margin-bottom:12px"><input type="date" value="${S.hf || ''}" onchange="S.hf=this.value;hl()"><input type="date" value="${S.ht || ''}" onchange="S.ht=this.value;hl()"></div><div id="hl"></div>`;
}
function hl() {
  const q = (S.q || '').toLowerCase(), kt = S.kf || '', f = S.hf || '', e = S.ht || '';
  const a = all().filter(x => (!kt || x.kat == kt) && (!f || x.tgl >= f) && (!e || x.tgl <= e) && (!q || (x.cat + x.kat + x.met + x.oleh).toLowerCase().includes(q)))
    .sort((p, q) => q.tgl.localeCompare(p.tgl)).slice(0, 200);
  $('#hl').innerHTML = a.length ? a.map(x => `<div class="glass item" onclick="openForm('${x.t}','${x.id}')"><div><b style="font-size:16px">${esc(x.kat)}</b><small>${x.tgl} · ${esc(x.met)} · ${esc(x.oleh)}${x.cat ? ' · ' + esc(x.cat) : ''}</small></div><b class="${x.t == 'masuk' ? 'in' : 'out'}">${x.t == 'masuk' ? '+' : '−'}${rp(x.nom)}</b></div>`).join('') : empty('Tidak ada transaksi yang cocok.');
}
const logv = () => `<h2>Log aktivitas</h2>` + (S.data.log.length ? S.data.log.map(l => `<div class="glass" style="padding:12px"><b style="font-size:16px">${esc(l.u)} · ${esc(l.a)} ${esc(l.j)}</b><small>${esc(l.w)}${l.d ? ' · ' + esc(l.d) : ''}</small></div>`).join('') : empty('Belum ada aktivitas.'));
const setv = () => `<h2>Setelan</h2><div class="glass"><small>Masuk sebagai</small><b>${esc(S.user)}</b></div>
  <div class="glass"><label style="margin-top:0">Saldo awal (sisa uang saat mulai memakai aplikasi)</label><input id="sa" inputmode="numeric" value="${dots(S.data.saldoAwal)}" oninput="this.value=dots(this.value)"><button class="btn" onclick="saveSaldo()">Simpan saldo awal</button></div>
  <button class="btn" style="background:#fff;color:var(--a);border:1px solid var(--a)" onclick="load()">Muat ulang data</button><button class="btn del" onclick="logout()">Keluar</button>`;
async function saveSaldo() {
  try { await api('saldo', { nilai: +$('#sa').value.replace(/\./g, '') }); toast('Saldo awal tersimpan'); load(true); } catch (e) { toast(e.message, 0); }
}

/* ===== FORM TRANSAKSI ===== */
function openForm(t = 'keluar', id = null) {
  if (!S.data) return;
  const x = id ? all().find(y => y.id == id && y.t == t) : null;
  F = { t, id, kat: x ? x.kat : (localStorage['k' + t] || ''), met: x ? x.met : (localStorage.m || 'Tunai'), nom: x ? dots(x.nom) : '', tgl: x ? x.tgl : iso(new Date()), cat: x ? x.cat : '' };
  formBody();
}
function closeForm() { $('#ov').innerHTML = ''; document.body.style.overflow = ''; }
function pick(k, el) { F[k] = el.dataset.v; el.parentNode.querySelectorAll('.chip').forEach(b => b.classList.toggle('on', b == el)); }
function vv() { const o = $('.ov'), v = window.visualViewport; if (o && v) { o.style.height = v.height + 'px'; o.style.top = v.offsetTop + 'px'; } }
if (window.visualViewport) { visualViewport.addEventListener('resize', vv); visualViewport.addEventListener('scroll', vv); }
function formBody(re) {
  const st = $('.sheet') ? $('.sheet').scrollTop : 0;
  document.body.style.overflow = 'hidden';
  const K = S.data.kat[F.t == 'masuk' ? 'Pemasukan' : 'Pengeluaran'], M = S.data.kat.Metode;
  const ch = (c, cur, key) => `<button class="chip ${c == cur ? 'on' : ''}" data-v="${esc(c)}" onclick="pick('${key}',this)">${esc(c)}</button>`;
  $('#ov').innerHTML = `<div class="ov ${re ? 'noanim' : ''}" onclick="if(event.target==this)closeForm()"><div class="sheet ${re ? 'noanim' : ''}">
  <div class="hd"><h2>${F.id ? 'Edit transaksi' : 'Catat transaksi'}</h2><button class="x" onclick="closeForm()" aria-label="Tutup">✕</button></div>
  ${F.id ? '' : `<div class="row" style="margin-bottom:14px">${[['keluar', 'Pengeluaran'], ['masuk', 'Pemasukan']].map(([k, l]) => `<button class="chip ${F.t == k ? 'on' : ''}" onclick="F.t='${k}';F.kat=localStorage['k${k}']||'';formBody(true)">${l}</button>`).join('')}</div>`}
  <input id="fn" inputmode="numeric" placeholder="Rp 0" value="${F.nom}" oninput="this.value=dots(this.value);F.nom=this.value" style="font-size:28px;font-weight:700;text-align:center">
  <label>Kategori</label><div class="chips">${K.map(c => ch(c, F.kat, 'kat')).join('')}</div>
  <label>Metode pembayaran</label><div class="chips">${M.map(c => ch(c, F.met, 'met')).join('')}</div>
  <label>Tanggal</label><input type="date" value="${F.tgl}" onchange="F.tgl=this.value">
  <label>Catatan (opsional)</label><input value="${esc(F.cat)}" oninput="F.cat=this.value" placeholder="Contoh: beli beras">
  <button class="chip" style="width:100%;margin-top:14px" onclick="$('#sc').click()">Scan struk / nota</button><input id="sc" type="file" accept="image/*" hidden onchange="scan(this.files[0])">
  <div class="ft"><button class="btn" id="sv" onclick="save()">Simpan</button>${F.id ? `<button class="btn del" onclick="del()">Hapus transaksi</button>` : ''}</div></div></div>`;
  $('.sheet').scrollTop = st; vv();
}
async function save() {
  const nom = +String(F.nom).replace(/\./g, '');
  if (!(nom > 0)) return toast('Isi nominal lebih dari 0', 0);
  if (!F.kat) return toast('Pilih kategori dulu', 0);
  const b = $('#sv'); b.disabled = true; b.textContent = 'Menyimpan…';
  try {
    await api(F.id ? 'edit' : 'add', { t: F.t, id: F.id, d: { nom, tgl: F.tgl, kat: F.kat, met: F.met, cat: F.cat } });
    localStorage['k' + F.t] = F.kat; localStorage.m = F.met;
    closeForm(); toast('Tersimpan ✓'); load(true);
  } catch (e) { toast(e.message, 0); b.disabled = false; b.textContent = 'Simpan'; }
}
async function del() {
  if (!confirm('Hapus transaksi ini? Tindakan ini tidak bisa dibatalkan.')) return;
  try { await api('del', { t: F.t, id: F.id }); closeForm(); toast('Terhapus'); load(true); } catch (e) { toast(e.message, 0); }
}

/* ===== SCAN STRUK (OCR di perangkat, gratis) ===== */
const lib = () => window.Tesseract ? Promise.resolve() : new Promise((ok, no) => {
  const s = document.createElement('script');
  s.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js'; s.onload = ok; s.onerror = no; document.head.appendChild(s);
});
async function small(f) {
  const b = await createImageBitmap(f), k = Math.min(1, 1600 / Math.max(b.width, b.height)), c = document.createElement('canvas');
  c.width = b.width * k; c.height = b.height * k; c.getContext('2d').drawImage(b, 0, 0, c.width, c.height); return c;
}
function parse(t) {
  const L = t.split('\n').map(s => s.trim()).filter(Boolean);
  const num = s => (s.match(/\d{1,3}(?:[.,]\d{3})+(?!\d)|\d{4,}/g) || []).map(v => +v.replace(/[.,]/g, '')).filter(v => v < 1e9);
  const pick = r => { const c = []; L.forEach((l, i) => { if (r.test(l)) c.push(...num(l), ...num(L[i + 1] || '')); }); return c.length ? Math.max(...c) : 0; };
  const nom = pick(/grand\s*total|total\s*(bayar|belanja|tagihan)/i) || pick(/total|jumlah/i) || Math.max(0, ...L.flatMap(num));
  const m = t.match(/(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4}|\d{2})\b/); let tgl = '';
  if (m && +m[2] <= 12 && +m[1] <= 31) { const y = +m[3] < 100 ? 2000 + +m[3] : +m[3]; tgl = `${y}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`; }
  return { nom, tgl, cat: L[0] ? 'Struk: ' + L[0].slice(0, 40) : '' };
}
async function scan(f) {
  if (!f) return;
  toast('Membaca struk… pertama kali bisa 30 detik', 1, 90000);
  try {
    await lib();
    const { data: { text } } = await Tesseract.recognize(await small(f), 'ind'), r = parse(text);
    if (r.nom) F.nom = dots(r.nom);
    if (r.tgl) F.tgl = r.tgl;
    if (r.cat && !F.cat) F.cat = r.cat;
    formBody(true);
    toast(r.nom ? 'Hasil scan terisi. Cek lagi sebelum menyimpan.' : 'Total tidak terbaca. Isi nominal manual.', !!r.nom);
  } catch (e) { toast('Scan gagal. Isi manual saja.', 0); }
}
boot();
