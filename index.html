/* ===== GERAK: semua interaksi beranimasi ===== */
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.98)}}
@keyframes slin{from{opacity:0;transform:translateX(26px)}}
@keyframes slout{to{opacity:0;transform:translateX(22px)}}
@keyframes grow{from{width:0}}
@keyframes bob{40%{transform:scale(1.28) rotate(-7deg)}}
@keyframes float{50%{transform:translateY(-7px) rotate(-1.5deg)}}
@keyframes wob{0%,100%{transform:rotate(5deg)}50%{transform:rotate(-4deg) scale(1.06)}}
@keyframes tin{from{opacity:0;transform:translate(-50%,-20px) scale(.92)}}
#v.an>*{animation:rise .55s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:var(--d,0ms)}
#v.pgin>*{animation:slin .42s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:var(--d,0ms)}
#v.pgout{animation:slout .16s ease-in both}
.bar i{animation:grow 1s cubic-bezier(.2,.8,.2,1) .15s backwards}
.hero .mc{animation:float 4.5s ease-in-out infinite}.stkr{animation:wob 3.4s ease-in-out infinite}

<body>
<header id="hd" hidden></header>
<div id="app"><div id="v"></div></div>
<nav id="nv" hidden></nav>
<div id="ov" role="dialog" aria-modal="true" onclick="closeMore()"></div>
<script>
/* ===== KONFIGURASI ===== */
const API_URL = 'https://script.google.com/macros/s/AKfycbwu7-tCu-wJbOmb4GdykiUQMnYSlKwfph-izp42URoFm6EzbvfkH-nB4mKE7ueuC2ORxA/exec';
const NAMA = ['Amar', 'Risa']; // harus sama dengan nama di Code.gs

const $ = s => document.querySelector(s);
const rp = n => 'Rp ' + Math.round(n).toLocaleString('id-ID');
const dots = s => String(s).replace(/\D/g, '').replace(/\B(?=(\d{3})+(?!\d))/g, '.');
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const iso = d => new Date(d - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
const D = s => new Date(s + 'T00:00:00');
const empty = m => `<div class="mu" style="text-align:center;padding:36px 10px">${m}</div>`;
let S = { user: localStorage.u, pin: localStorage.p, data: null, tab: 'home', per: 'bulan', from: '', to: '' }, F = {}, LU = NAMA[0];

async function api(act, extra = {}) {
  let j;
  try {
    const r = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ act, user: S.user, pin: S.pin, ...extra }) });
    j = await r.json();
  } catch (e) { throw new Error('Tidak bisa terhubung. Periksa internet lalu coba lagi.'); }
  if (!j.ok) throw new Error(j.error);
  return j.data;
}
function toast(m, ok = 1, ms = 2600) {
  m = String(m).replace(/ \((?:BCA|BNI|BSN)\)/g, '');
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = m; t.style.background = ok ? '#0b7d57' : '#c4243f';
  document.body.appendChild(t); if (ok && /✓/.test(m)) burst(innerWidth / 2, 60);
  setTimeout(() => { t.classList.add('bye'); setTimeout(() => t.remove(), 280); }, ms);
}

/* ===== LOGIN & NAVIGASI ===== */
function loginView() {
  document.documentElement.dataset.th = LU == 'Risa' ? 'pink' : 'navy';
  $('#nv').hidden = true; $('#hd').hidden = true;
  $('#v').innerHTML = `<div style="padding-top:12vh;text-align:center"><div class="logo">${BRAND}</div><h2>${APP}</h2><p class="mu">Uang kita, cerita kita.<br>Pilih nama, lalu masukkan PIN.</p>
  <div class="chips" style="justify-content:center">${NAMA.map(n => `<button class="chip ${n == LU ? 'on' : ''}" onclick="LU='${n}';loginView()">${n}</button>`).join('')}</div>
  <input id="pin" type="password" inputmode="numeric" placeholder="PIN" style="margin:16px 0 0;text-align:center"><button class="btn" onclick="doLogin()">Masuk</button></div>`;
}
async function doLogin() {
  S.user = LU; S.pin = $('#pin').value;
  try { await api('login'); localStorage.u = S.user; localStorage.p = S.pin; boot(); } catch (e) { toast(e.message, 0); }
}
function logout() { localStorage.removeItem('u'); localStorage.removeItem('p'); S.user = S.pin = S.data = null; loginView(); }
const I = {
  copy: '<rect x="9" y="9" width="11" height="11" rx="3"/><path d="M5 15V6a2 2 0 0 1 2-2h8"/>',
  grid: '<rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/>',
  rcpt: '<path d="M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6"/>',
  wal: '<rect x="3.5" y="6.5" width="17" height="13" rx="3"/><path d="M3.5 10.5h17M16.5 15h.01"/>',
  more: '<path d="M6 12h.01M12 12h.01M18 12h.01" stroke-width="3"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  log: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  cog: '<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>'
};
const APP = 'Duitnya Amaris';
const BRAND = '<svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="18" fill="#1A2340"/><rect x="19" y="30" width="26" height="20" rx="6" fill="#FFF8E7"/><rect x="21" y="47" width="5" height="8" rx="2.5" fill="#FFF8E7"/><rect x="38" y="47" width="5" height="8" rx="2.5" fill="#FFF8E7"/><path d="M8 33C21 31 27 21 32 8C37 21 43 31 56 33Z" fill="#C6EA4F"/><circle cx="32" cy="40.5" r="6.5" fill="#FF5A36"/><path d="M32 44c-3.8-2.6-4.6-4.2-4.6-5.6a2.4 2.4 0 0 1 4.6-1 2.4 2.4 0 0 1 4.6 1c0 1.4-.8 3-4.6 5.6z" fill="#fff"/></svg>';
const MASC = '<svg class="mc" viewBox="0 0 130 96" aria-hidden="true"><ellipse cx="65" cy="91" rx="40" ry="4" fill="#000" opacity=".2"/><rect x="40" y="78" width="9" height="13" rx="4" fill="#FFF8E7"/><rect x="81" y="78" width="9" height="13" rx="4" fill="#FFF8E7"/><rect x="30" y="46" width="70" height="38" rx="13" fill="#FFF8E7"/><path d="M10 52C34 48 48 32 65 6C82 32 96 48 120 52Z" fill="#C6EA4F"/><circle cx="65" cy="66" r="14" fill="#FF5A36"/><circle cx="60" cy="63" r="2" fill="#fff"/><circle cx="70" cy="63" r="2" fill="#fff"/><path d="M59 69q6 5 12 0" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/><circle cx="15" cy="26" r="7" fill="#FFD369"/><circle cx="15" cy="26" r="3.5" fill="none" stroke="#E0A92F" stroke-width="1.6"/><circle cx="115" cy="20" r="5.5" fill="#FFD369"/></svg>';
const ML = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
const KCL = { Tabungan: 'c-lv', Darurat: 'c-pe', Taktis: 'c-li' };
function shell() {
  const T = S.tab, b = (t, l, i, on) => `<button class="${on ? 'on' : ''}" data-t="${t}" onclick="${t == 'more' ? 'openMore()' : `go('${t}')`}"><span class="ic"><svg viewBox="0 0 24 24">${I[i]}</svg></span>${l}</button>`;
  $('#nv').hidden = false; $('#hd').hidden = false;
  $('#nv').innerHTML = b('home', 'Ringkasan', 'grid', T == 'home') + b('hist', 'Transaksi', 'rcpt', T == 'hist')
    + `<button class="fb" onclick="openForm()" aria-label="Catat transaksi"><span class="fab"><svg viewBox="0 0 24 24">${I.plus}</svg></span>Catat</button>`
    + b('kan', 'Kantong', 'wal', T == 'kan') + b('more', 'Lainnya', 'more', ['stat', 'log', 'set'].includes(T));
  $('#hd').innerHTML = `<div class="hdi"><div class="br">${BRAND}${APP}</div><button class="av2" onclick="go('set')" aria-label="Setelan">${NAMA.map((n, i) => `<span class="${n == S.user ? 'me' : ''}" style="background:${['#FFC9B3', '#CDEF6B'][i % 2]}">${esc(n[0])}</span>`).join('')}</button></div>`;
}
function openMore() {
  const sv = k => `<svg class="i" viewBox="0 0 24 24" width="22" height="22">${I[k]}</svg>`;
  const mi = (c, i, t, d, fn) => `<button class="mi ${c}" onclick="closeMore();${fn}"><span class="tile">${i}</span><span><b>${t}</b><small>${d}</small></span></button>`;
  $('#ov').innerHTML = `<div class="sh" onclick="event.stopPropagation()"><i class="grab"></i><div class="between shh"><div><small class="eb">Ruang lainnya</small><h2 style="margin:2px 0 0">Mau ke mana?</h2></div><button class="x" onclick="closeMore()" aria-label="Tutup">${ic('x', 20)}</button></div>
  <div class="mg">${mi('', ic('bars', 22), 'Laporan', 'Statistik & insight', "go('stat')")}${mi('', sv('log'), 'Aktivitas', 'Siapa mencatat apa', "go('log')")}${mi('', ic('sync', 22), 'Sesuaikan saldo', 'Sama dengan bank', 'openAdj()')}${mi('', ic('swap', 22), 'Pindah dana', 'Antar kantong', 'openK(KT[0])')}${mi('w', sv('cog'), 'Setelan', 'Tema, saldo awal, keluar', "go('set')")}</div>
  <small class="eb" style="margin:22px 2px 10px">Rekening kantong</small>${KT.map(rkRow).join('')}</div>`;
  void $('#ov').offsetHeight; requestAnimationFrame(() => { $('#ov').classList.add('on'); barTo(1); });
}
function closeMore() { const sh = $('#ov .sh'); if (sh) sh.style.transform = ''; $('#ov').classList.remove('on'); barTo(0); }
function syncNav() { const T = S.tab, on = ['stat', 'log', 'set'].includes(T) ? 'more' : T; document.querySelectorAll('#nv button[data-t]').forEach(b => b.classList.toggle('on', b.dataset.t == on)); }
function go(t) { S.tab = t; syncNav(); render(true); scrollTo(0, 0); }
async function boot() { applyTh(); if (S.user && S.pin) { shell(); load(); } else loginView(); }
async function load(silent) {
  if (!silent) $('#v').innerHTML = '<div class="sk"></div><div class="sk"></div><div class="sk"></div>';
  try { const d = await api('load'); ['masuk', 'keluar', 'pindah'].forEach(k => (d[k] || []).forEach(x => x.tgl = nd(x.tgl))); const sg = JSON.stringify(d); if (silent && S.sig === sg) return true; S.sig = sg; S.data = d; render(!silent); return true; }
  catch (e) {
    if (/PIN/.test(e.message)) { toast(e.message, 0); return logout(); }
    if (silent && S.data) { toast(e.message, 0); return false; }
    $('#v').innerHTML = empty(esc(e.message) + '<br><br><button class="chip" onclick="load()">Coba lagi</button>');
  }
}
function render(an) {
  if (!S.data || $('#v').dataset.pg) return;
  const v = $('#v'), T = S.tab;
  if (T == 'home') v.innerHTML = home();
  else if (T == 'hist') { v.innerHTML = hist(); hl(); }
  else if (T == 'kan') v.innerHTML = kanv();
  else if (T == 'stat') v.innerHTML = statv();
  else if (T == 'log') v.innerHTML = logv();
  else v.innerHTML = setv();
  if (an) { flow(v, 'an'); animNums(); stkHint(); }
}

/* ===== DATA & PERIODE ===== */
const all = () => [...S.data.masuk.map(x => ({ ...x, t: 'masuk' })), ...S.data.keluar.map(x => ({ ...x, t: 'keluar' }))];
const inR = (x, f, e) => x.tgl >= f && x.tgl <= e;
const tot = (a, t, f, e) => a.filter(x => x.t == t && inR(x, f, e)).reduce((s, x) => s + x.nom, 0);
function rng() {
  const n = new Date(), t = iso(n); let f = t, e = t;
  if (S.per == 'minggu') f = iso(new Date(n.getFullYear(), n.getMonth(), n.getDate() - 6));
  else if (S.per == 'bulan' || S.per == 'custom') f = t.slice(0, 8) + '01';
  if (S.per == 'custom' && S.from && S.to) { f = S.from; e = S.to; if (f > e) [f, e] = [e, f]; }
  return [f, e];
}
/* normalisasi tanggal dari spreadsheet (yyyy-mm-dd, dd/mm/yyyy, atau format ISO panjang) */
const nd = v => {
  v = String(v == null ? '' : v).trim(); let m = v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m) return m[1] + '-' + m[2].padStart(2, '0') + '-' + m[3].padStart(2, '0');
  m = v.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})/);
  return m ? m[3] + '-' + m[2].padStart(2, '0') + '-' + m[1].padStart(2, '0') : v.slice(0, 10);
};
const BL = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
const fd = v => { const d = D(v); return d.getDate() + ' ' + BL[d.getMonth()] + ' ' + d.getFullYear(); };
const toDMY = v => v.slice(8) + '/' + v.slice(5, 7) + '/' + v.slice(0, 4);
/* input tanggal ketik manual: dd/mm/yyyy (garis miring otomatis) */
const dmask = v => { const d = String(v).replace(/\D/g, '').slice(0, 8); return d.length > 4 ? d.slice(0, 2) + '/' + d.slice(2, 4) + '/' + d.slice(4) : d.length > 2 ? d.slice(0, 2) + '/' + d.slice(2) : d; };
const pdm = t => { const m = String(t).match(/^(\d{2})\/(\d{2})\/(\d{4})$/); if (!m) return ''; const dt = new Date(+m[3], +m[2] - 1, +m[1]); return dt.getFullYear() == +m[3] && dt.getMonth() == +m[2] - 1 && dt.getDate() == +m[1] ? m[3] + '-' + m[2] + '-' + m[1] : ''; };
const dIn = (k, cb) => `<input inputmode="numeric" maxlength="10" autocomplete="off" placeholder="dd/mm/yyyy" value="${esc(S[k + 'T'] || '')}" oninput="dset('${k}',this,${cb})">`;
function dset(k, el, cb) { el.value = dmask(el.value); S[k + 'T'] = el.value; S[k] = pdm(el.value); cb(); }
const RR = n => localStorage.h == '1' ? 'Rp •••••' : rp(n);
function per(k) {
  S.per = k;
  if (k == 'custom' && !S.from && !S.to) { const T = iso(new Date()); S.from = T.slice(0, 8) + '01'; S.fromT = toDMY(S.from); S.to = T; S.toT = toDMY(T); }
  render();
}

/* ===== BERANDA ===== */
function trend(a, f, e, days) {
  const g = days > 62 ? 7 : 10, B = {};
  if (days <= 62) for (let i = 0; i < days; i++) B[iso(new Date(+D(f) + i * 864e5))] = [0, 0];
  a.filter(x => inR(x, f, e)).forEach(x => { const k = x.tgl.slice(0, g); (B[k] = B[k] || [0, 0])[x.t == 'masuk' ? 0 : 1] += x.nom; });
  const K = Object.keys(B).sort(), mx = Math.max(1, ...K.map(k => Math.max(...B[k]))), w = 300 / K.length;
  return `<svg viewBox="0 0 300 112" width="100%">` + K.map((k, i) => {
    const h1 = B[k][0] / mx * 95, h2 = B[k][1] / mx * 95;
    return `<rect x="${i * w + w * .08}" y="${100 - h1}" width="${w * .4}" height="${h1}" rx="2" fill="#0b7d57"/><rect x="${i * w + w * .5}" y="${100 - h2}" width="${w * .4}" height="${h2}" rx="2" fill="#c4243f"/>`;
  }).join('') + `<text x="0" y="111" font-size="9" fill="#3c3f4a">${K[0].slice(5)}</text><text x="300" y="111" font-size="9" fill="#3c3f4a" text-anchor="end">${K[K.length - 1].slice(5)}</text></svg>`;
}
const fdx = v => /^\d{4}-\d{2}-\d{2}$/.test(v) ? fd(v) : v;

function home() {
  const a = all(), T = iso(new Date()), R = RR, [f, e, m] = mrg(), mn = ML[m.getMonth()], hide = localStorage.h == '1', fr = S.ks || 0;

const lib = () => window.Tesseract ? Promise.resolve() : new Promise((ok, no) => {

}

}

/* tarik ke bawah untuk memuat ulang */
(function () {

  const set = (y, o, t) => { el.style.transition = t ? 'transform .25s,opacity .25s' : 'none'; el.style.transform = `translateY(${y}px) rotate(${y * 4}deg)`; el.style.opacity = o; };

    y0 = e.touches[0].clientY; d = 0;
  }, { passive: true });
  document.addEventListener('touchmove', e => {
    if (!on) return;
    d = e.touches[0].clientY - y0;

  document.addEventListener('touchend', async () => {
    if (!on) return; on = false;

      try { if (await load(true)) toast('Data diperbarui'); } finally { busy = false; el.classList.remove('go'); hide(); }
    } else hide();
  });
  document.addEventListener('touchcancel', () => { on = false; hide(); });
})();
['gesturestart', 'gesturechange', 'gestureend'].forEach(t => document.addEventListener(t, e => e.preventDefault()));
/* data otomatis diperbarui saat aplikasi dibuka lagi (Amar & Risa mencatat dari HP masing-masing) */

/* ===== v4: logo bank inline, rekening + salin, geser chip dengan mouse/roda ===== */
const lg = (k, f = 1) => { const l = BLOGO[bank(k)]; return l ? `<span class="bl"><img src="${l[0]}" alt="${bank(k)}" height="${Math.round(l[1] * f)}" decoding="async"></span>` : ''; };
const cpIc = `<svg class="i" viewBox="0 0 24 24" width="16" height="16">${I.copy}</svg>`;
const rkRow = k => `<div class="rk"><span class="rl">${lg(k, 1.15)}</span><span class="rn"><small>${KN(k)}</small><b>${REK[k]}</b></span><button class="cp" onclick="cpRek('${k}',this)" aria-label="Salin rekening ${BANK[k]}">${cpIc} Salin</button></div>`;
async function cpRek(k, btn) {
  const t = REK[k]; let ok = false;
  try { await navigator.clipboard.writeText(t); ok = true; } catch (_) {
    const a = document.createElement('textarea'); a.value = t; a.setAttribute('readonly', ''); a.style.cssText = 'position:fixed;top:0;opacity:0';
    document.body.appendChild(a); a.select(); a.setSelectionRange(0, 99); try { ok = document.execCommand('copy'); } catch (_) {} a.remove();
  }
  if (!ok) return toast('Gagal menyalin. Tekan lama nomornya lalu pilih Salin.', 0);
  btn.classList.add('ok'); btn.innerHTML = ic('check', 16) + ' Tersalin'; toast('Rekening ' + BANK[k] + ' disalin');
  clearTimeout(btn._t); btn._t = setTimeout(() => { btn.classList.remove('ok'); btn.innerHTML = cpIc + ' Salin'; }, 1800);
}
(function () { // baris chip: drag dengan mouse + roda mouse (di HP tetap geser jari seperti biasa)
  let el = null, x0 = 0, s0 = 0, mv = 0;
  document.addEventListener('pointerdown', e => { const q = e.pointerType == 'mouse' && !e.button && e.target.closest('.qk'); if (q) { el = q; x0 = e.clientX; s0 = q.scrollLeft; mv = 0; } });
  document.addEventListener('pointermove', e => { if (!el) return; const dx = e.clientX - x0; if (!mv && Math.abs(dx) < 5) return; mv = 1; el.classList.add('drag'); el.scrollLeft = s0 - dx; });
  const end = () => { if (el) { el.classList.remove('drag'); if (mv) { const q = el; q.dataset.nc = 1; setTimeout(() => delete q.dataset.nc, 0); } } el = null; };
  document.addEventListener('pointerup', end); document.addEventListener('pointercancel', end);
  document.addEventListener('click', e => { if (e.target.closest('.qk[data-nc]')) { e.stopPropagation(); e.preventDefault(); } }, true);
})();
function qkBind() {
  document.querySelectorAll('.qk').forEach(q => {
    if (q._w) return; q._w = 1;
    q.addEventListener('wheel', e => {
      const mx = q.scrollWidth - q.clientWidth;
      if (Math.abs(e.deltaY) > Math.abs(e.deltaX) && ((e.deltaY > 0 && q.scrollLeft < mx - 1) || (e.deltaY < 0 && q.scrollLeft > 1))) { q.scrollLeft += e.deltaY; e.preventDefault(); }

const _render = render; render = function (...a) { _render(...a); qkBind(); };
