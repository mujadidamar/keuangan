<script>
/* ===== KONFIGURASI ===== */
const API_URL = 'https://script.google.com/macros/s/AKfycbwu7-tCu-wJbOmb4GdykiUQMnYSlKwfph-izp42URoFm6EzbvfkH-nB4mKE7ueuC2ORxA/exec';
const NAMA = ['Amar', 'Risa']; // harus sama dengan nama di Code.gs

const $ = s => document.querySelector(s);
const rp = n => 'Rp ' + Math.round(n).toLocaleString('id-ID');
const dots = s => String(s).replace(/\D/g, '').replace(/\B(?=(\d{3})+(?!\d))/g, '.');
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const iso = d => new Date(d - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
const D = s => new Date(s + 'T00:00:00');
const empty = m => `<div class="mu" style="text-align:center;padding:36px 10px">${m}</div>`;
let S = { user: localStorage.u, pin: localStorage.p, data: null, tab: 'home', per: 'bulan', from: '', to: '' }, F = {}, LU = NAMA[0];

async function api(act, extra = {}) {
  let j;
  try {
    const r = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ act, user: S.user, pin: S.pin, ...extra }) });
    j = await r.json();
  } catch (e) { throw new Error('Tidak bisa terhubung. Periksa internet lalu coba lagi.'); }
  if (!j.ok) throw new Error(j.error);
  return j.data;
}
function toast(m, ok = 1, ms = 2600) {
  document.querySelectorAll('.toast').forEach(t => t.remove());

  return `<svg viewBox="0 0 300 112" width="100%">` + K.map((k, i) => {

  }).join('') + `<text x="0" y="111" font-size="9" fill="#3c3f4a">${K[0].slice(5)}</text><text x="300" y="111" font-size="9" fill="#3c3f4a" text-anchor="end">${K[K.length - 1].slice(5)}</text></svg>`;

const lib = () => window.Tesseract ? Promise.resolve() : new Promise((ok, no) => {

}
function parse(t) {

  const num = s => (s.match(/\d{1,3}(?:[.,]\d{3})+(?!\d)|\d{4,}/g) || []).map(v => +v.replace(/[.,]/g, '')).filter(v => v < 1e9);

  const m = t.match(/(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4}|\d{2})\b/); let tgl = '';

  return { nom, tgl, cat: L[0] ? 'Struk: ' + L[0].slice(0, 40) : '' };
}

}

const EM = { 'Makan & Minum': '🍜', 'Transportasi': '🛵', 'Belanja Harian': '🛒', 'Tagihan Air': '💧', 'Tagihan Wifi': '📶', 'Token Listrik': '⚡', 'Iuran Sampah': '🗑️', 'Kuota Internet': '📱', 'Cicilan': '💳', 'Kesehatan': '💊', 'Pendidikan': '🎓', 'Hiburan': '🎬', 'Sedekah/Donasi': '🤲', 'Biaya Admin Bank': '🏦', 'Lainnya': '✨', 'Gaji': '💰', 'Bonus/Tunjangan': '🌟', 'Usaha Sampingan': '💼', 'Hadiah': '🎁', 'Bunga Bank': '📈', 'Tunai': '💵', 'Transfer': '🔄', 'E-Wallet': '👛', 'Kartu': '💳', 'QRIS': '📲', 'Tabungan': '🐷', 'Darurat': '🚨', 'Taktis': '🎯' };
const CJ = '<svg class="cj" viewBox="0 0 32 32"><ellipse cx="16" cy="28.4" rx="9.5" ry="1.8" fill="#000" opacity=".1"/><path d="M8.5 12.5C5.8 14.6 4 17.8 4 21.4 4 26 9 29 16 29s12-3 12-7.6c0-3.6-1.800-6.800-4.500-8.900z" fill="#F29A52"/><path d="M5.200 19.500c2.800 1.600 6.600 2.300 10.800 2.300s8-.7 10.800-2.300" fill="none" stroke="#C85F23" stroke-width="1.200" opacity=".55"/><ellipse cx="10.800" cy="20" rx="1.900" ry="4.200" fill="#fff" opacity=".3" transform="rotate(14 10.800 20)"/><rect x="9.500" y="9.200" width="13" height="4.600" rx="2.300" fill="#D8692A"/><rect x="12.500" y="10.700" width="7" height="1.600" rx=".8" fill="#6E2E12"/><circle cx="16" cy="5" r="3.500" fill="#FFD369" stroke="#F0B43A" stroke-width="1"/><circle cx="16" cy="5" r="1.500" fill="none" stroke="#F0B43A" stroke-width=".8"/></svg>';
const em = n => n == 'Tabungan' ? CJ : (EM[n] || '✨');
const TCS = ['#ffe0e6', '#ffe9d0', '#fff3b8', '#d4f7e0', '#d0f1fb', '#dbe6ff', '#eadcff', '#ffd9f0'];
const tc = n => TCS[[...String(n)].reduce((h, c) => h + c.charCodeAt(0), 0) % 8];
const ic = (n, z = 20) => `<svg class="i" viewBox="0 0 24 24" width="${z}" height="${z}">${P[n] || P.dots}</svg>`;

/* kantong dipakai bersama (Amar & Risa); jumlah semua kantong = saldo keseluruhan */
const KT = ['Tabungan', 'Darurat', 'Taktis'];
const KS = { Tabungan: 'Tabungan (BCA)', Darurat: 'Darurat (BSN)', Taktis: 'Taktis (BNI)' }, KN = k => 'Kantong ' + (KS[k] || k);
const KC = { Tabungan: 'linear-gradient(135deg,#ff8fb7,#ff5e9a)', Darurat: 'linear-gradient(135deg,#ffb04c,#ff6b3d)', Taktis: 'linear-gradient(135deg,#6aa8ff,#6f63ff)' };
const PN = () => S.data.pindah || [];
const kb = kt => ((S.data.saldoAwal || {})[kt] || 0) + all().filter(x => x.kt == kt).reduce((s, x) => s + (x.t == 'masuk' ? x.nom : -x.nom), 0) + PN().reduce((s, x) => s + (x.ke == kt ? x.jml : 0) - (x.dari == kt ? x.jml : 0), 0);
const kTot = () => KT.reduce((s, k) => s + kb(k), 0);
const totalSaldo = () => { const a = all(); return KT.reduce((s, k) => s + ((S.data.saldoAwal || {})[k] || 0), 0) + tot(a, 'masuk', '0', '9') - tot(a, 'keluar', '0', '9'); };
function sheetUI(title, inner, foot, keep) {
  const y = keep ? scrollY : 0;
  if (!$('#v').dataset.pg) S.y = scrollY;
  $('#v').dataset.pg = '1'; document.body.classList.add('pgm'); $('#nv').hidden = true; $('#hd').hidden = true;
  $('#v').innerHTML = `<div class="pg"><button class="x" onclick="closeForm()" aria-label="Kembali">${ic('back', 22)}</button><h2>${title}</h2></div>${inner}<div class="ft">${foot}</div>`;
  scrollTo(0, y);
}
const chipsOf = (key, st) => `<div class="chips">${KT.map(c => `<button class="chip ${st[key] == c ? 'on' : ''}" data-v="${c}" onclick="${st === K ? 'K' : 'A'}.${key}=this.dataset.v;this.parentNode.querySelectorAll('.chip').forEach(b=>b.classList.toggle('on',b==this))">${em(c)} ${KS[c]}</button>`).join('')}</div>`;
function kantongView(R) {
  const tt = totalSaldo();
  return `<div class="row"><div class="glass" style="margin:0"><small>Saldo keseluruhan</small><b>${R(tt)}</b></div><div class="glass" style="margin:0"><small>Saldo total kantong</small><b>${R(kTot())}</b></div></div>
  <p class="mu" style="font-size:13px;margin:10px 2px 14px">Jumlah ketiga kantong selalu sama dengan saldo keseluruhan. Ketuk kantong untuk memindahkan dana atau melihat aktivitasnya.</p>`
    + KT.map(kt => { const v = kb(kt), p = tt > 0 ? Math.max(0, Math.min(100, Math.round(v / tt * 100))) : 0; return `<div class="glass kc ${KCL[kt]}" onclick="openK('${kt}')"><span class="tile">${em(kt)}</span><div class="info"><small>${KN(kt)}</small><b>${R(v)}</b><div class="bar"><i style="width:${p}%"></i></div></div><span class="pc">${p}%</span></div>`; }).join('');
}
let K = {}, A = {};
function openK(kt) { K = { dari: kt, ke: KT.find(x => x != kt), nom: '', cat: '', tgl: iso(new Date()), kt }; kBody(); }
function kBody() {
  const kt = K.kt, ev = [...all().filter(x => x.kt == kt).map(x => ({ tgl: x.tgl, id: x.id, t: 'tx', txt: x.kat, e: em(x.kat), oleh: x.oleh, v: x.t == 'masuk' ? x.nom : -x.nom })),
    ...PN().filter(x => x.dari == kt || x.ke == kt).map(x => ({ tgl: x.tgl, id: x.id, t: 'pn', txt: x.dari == kt ? 'Pindah ke ' + (KS[x.ke] || x.ke) : 'Pindah dari ' + (KS[x.dari] || x.dari), e: '🔄', oleh: x.oleh, v: x.ke == kt ? x.jml : -x.jml }))].sort((p, q) => q.tgl.localeCompare(p.tgl)).slice(0, 8);
  sheetUI(`${em(kt)} ${KN(kt)}`, `<div class="glass hero"><small>Saldo ${KN(kt)}</small><div class="bal"><b>${rp(kb(kt))}</b></div></div>
  <h4 style="margin-top:14px">Pindahkan dana</h4><label style="margin-top:6px">Dari</label>${chipsOf('dari', K)}<label>Ke</label>${chipsOf('ke', K)}
  <input inputmode="numeric" placeholder="Rp 0" value="${K.nom}" oninput="this.value=dots(this.value);K.nom=this.value" style="margin-top:12px;font-size:26px;font-weight:700;text-align:center">
  <label>Catatan (opsional)</label><input value="${esc(K.cat)}" oninput="K.cat=this.value">
  <h4 style="margin-top:18px">Aktivitas terbaru</h4>${ev.length ? ev.map(e => `<div class="between" style="align-items:center;padding:9px 0;border-bottom:1px solid var(--ln)"><span><span class="em">${e.e}</span> <b style="display:inline;font-size:15px">${esc(e.txt)}</b><br><small>${fdx(e.tgl)} · ${esc(e.oleh)}</small></span><span><b class="${e.v > 0 ? 'in' : 'out'}" style="display:inline;font-size:15px">${e.v > 0 ? '+' : '−'}${rp(Math.abs(e.v))}</b>${e.t == 'pn' ? ` <button class="lnk" onclick="delP('${e.id}')" aria-label="Hapus">${ic('trash', 18)}</button>` : ''}</span></div>`).join('') : empty('Belum ada aktivitas di kantong ini.')}`,
  `<button class="btn" id="sv" onclick="saveK()">Pindahkan dana</button>`);
}
async function saveK() {
  const j = +String(K.nom).replace(/\./g, '');
  if (K.dari == K.ke) return toast('Pilih dua kantong yang berbeda', 0);
  if (!(j > 0)) return toast('Isi nominal lebih dari 0', 0);
  const b = $('#sv'); b.disabled = true; b.textContent = 'Memindahkan…';
  try { await api('pindah', { d: { dari: K.dari, ke: K.ke, jml: j, tgl: K.tgl, cat: K.cat } }); closeForm(); toast('Dana dipindahkan ✓'); load(true); }
  catch (e) { toast(e.message, 0); b.disabled = false; b.textContent = 'Pindahkan dana'; }
}
async function delP(id) {
  if (!confirm('Hapus catatan pemindahan ini?')) return;
  try { await api('delp', { id }); closeForm(); toast('Terhapus'); load(true); } catch (e) { toast(e.message, 0); }
}
function openAdj() {
  A = { kt: localStorage.kt || 'Taktis' };
  sheetUI('Sesuaikan saldo', `<p class="mu">Masukkan saldo asli di m-banking atau e-wallet (gabungan semua). Selisihnya dicatat otomatis sebagai biaya admin bank, supaya saldo di aplikasi sama dengan bank.</p>
  <div class="glass" style="box-shadow:none;background:var(--al)"><small>Saldo keseluruhan di aplikasi</small><b>${rp(totalSaldo())}</b></div>
  <input id="aj" inputmode="numeric" placeholder="Rp 0 (saldo asli)" oninput="this.value=dots(this.value);adjP()" style="font-size:26px;font-weight:700;text-align:center"><p id="ajp" class="mu" style="text-align:center"></p>
  <label>Dibebankan ke kantong</label>${chipsOf('kt', A)}`,
  `<button class="btn" id="sv" onclick="doAdj()">Catat penyesuaian</button>`);
}
const adjD = () => +($('#aj').value || '0').replace(/\./g, '') - totalSaldo();
function adjP() { const d = adjD(); $('#ajp').textContent = !$('#aj').value ? '' : d == 0 ? 'Saldo sudah sama.' : d < 0 ? `Selisih −${rp(-d)} → dicatat sebagai Biaya Admin Bank` : `Selisih +${rp(d)} → dicatat sebagai pemasukan Bunga Bank`; }
async function doAdj() {
  if (!$('#aj').value) return toast('Isi saldo asli dulu', 0);
  const d = adjD(); if (!d) return toast('Saldo sudah sama, tidak perlu penyesuaian');
  if (!confirm(`Catat selisih ${rp(Math.abs(d))} sebagai ${d < 0 ? 'Biaya Admin Bank' : 'Bunga Bank'} di ${KN(A.kt)}?`)) return;
  try { await api('add', { t: d < 0 ? 'keluar' : 'masuk', d: { nom: Math.abs(d), tgl: iso(new Date()), kat: d < 0 ? 'Biaya Admin Bank' : 'Bunga Bank', met: 'Transfer', cat: 'Penyesuaian saldo bank', kt: A.kt } }); closeForm(); toast('Saldo disesuaikan ✓'); load(true); }
  catch (e) { toast(e.message, 0); }
}

/* tarik ke bawah untuk memuat ulang */
(function () {
  const el = document.createElement('div'); el.id = 'ptr'; el.innerHTML = ic('sync', 20); document.body.appendChild(el);
  let y0 = 0, d = 0, on = false, busy = false;
  const set = (y, o, t) => { el.style.transition = t ? 'transform .25s,opacity .25s' : 'none'; el.style.transform = `translateY(${y}px) rotate(${y * 4}deg)`; el.style.opacity = o; };
  const hide = () => set(-70, 0, 1), pull = () => Math.min(d * .5, 80);
  document.addEventListener('touchstart', e => {
    on = !busy && e.touches.length == 1 && scrollY <= 0 && !!S.data && !$('#v').dataset.pg && !e.target.closest('input,select,textarea');
    y0 = e.touches[0].clientY; d = 0;
  }, { passive: true });
  document.addEventListener('touchmove', e => {
    if (!on) return;
    d = e.touches[0].clientY - y0;
    if (d <= 0 || scrollY > 0) { if (d <= 0) { on = false; hide(); } return; }
    if (e.cancelable) e.preventDefault();
    set(-70 + pull(), Math.min(1, pull() / 50));
  }, { passive: false });
  document.addEventListener('touchend', async () => {
    if (!on) return; on = false;
    if (pull() >= 60 && !busy) {
      busy = true; el.classList.add('go'); set(14, 1, 1);
      try { if (await load(true)) toast('Data diperbarui'); } finally { busy = false; el.classList.remove('go'); hide(); }
    } else hide();
  });
  document.addEventListener('touchcancel', () => { on = false; hide(); });
})();
['gesturestart', 'gesturechange', 'gestureend'].forEach(t => document.addEventListener(t, e => e.preventDefault()));
/* data otomatis diperbarui saat aplikasi dibuka lagi (Amar & Risa mencatat dari HP masing-masing) */
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.data && !$('#v').dataset.pg) load(true); });
boot();
</script></body></html>
